name: CI Pipeline & Quality Gate

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax and integrity
        run: |
          python -m py_compile run.py scheduler.py database.py config.py utils.py news_model.py

      - name: Run test suite with pytest
        run: |
          pytest -v --tb=short

  quality-gate:
    name: Merge Protection Gate
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more test matrix jobs failed. Merging to main is blocked."
            exit 1
          fi
          echo "All test suites passed successfully. Safe to merge into main!"
