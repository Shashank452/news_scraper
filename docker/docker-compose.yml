version: '3.8'

services:
  news_scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: news_scraper:latest
    container_name: news_scraper_all_in_one
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5432:5432"
    environment:
      - DATABASE_TYPE=postgres
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEY=dev_secret_api_key_change_in_production
      - LOG_LEVEL=INFO
      - SCRAPE_INTERVAL_MARKET_SECONDS=120
      - SCRAPE_INTERVAL_OFF_HOURS_SECONDS=900
      - BODY_RETENTION_DAYS=90
    volumes:
      - news_scraper_data:/app/data
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  news_scraper_data:
    driver: local
  pg_data:
    driver: local
